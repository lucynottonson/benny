<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Benny Birthday Opening</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    #card {
      width: 300px;
      height: 200px;
      margin: 100px auto;
      perspective: 1000px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
    }

    .card-half {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background-color: #fff;
      border: 2px solid #000;
      border-radius: 10px;
    }

    .card-half.back {
      transform: rotateY(180deg);
    }

    #card.flipped {
      transform: rotateY(180deg);
    }

    #card.zoomed {
      transform: scale(3) rotateY(180deg);
      transition: transform 1s ease-in-out;
      z-index: 999;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div id="card">
    <div class="card-half front">
      <span>click me</span>
    </div>
    <div class="card-half back">
      <span>Happy Birthday Benny!</span>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
  <script>
    const card = document.getElementById('card');

    card.addEventListener('click', () => {
      card.classList.add('flipped');

      setTimeout(() => {
        card.classList.add('zoomed');
      }, 1000); // wait for flip animation to finish

      setTimeout(() => {
        window.location.href = 'scene2.html';
      }, 2500); // wait for zoom animation to finish
    });
  </script>
</body>
</html>
